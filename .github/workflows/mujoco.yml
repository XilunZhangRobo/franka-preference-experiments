name: MuJoCo experiment checks
on:
  pull_request:
    paths:
      - "visual_prefs/**"
      - "tests/**"
      - "tools/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/mujoco.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      MUJOCO_GL: egl
      OPENBLAS_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1-mesa-dri
      - run: uv sync --locked --python 3.13
      - run: uv run --locked ruff check visual_prefs tools tests
      - run: uv run --locked ruff format --check visual_prefs tools tests
      - run: uv run --locked franka-prefs assets
      - run: uv run --locked python -m unittest discover -s tests -v
      - run: uv run --locked franka-prefs audit --out runs/ci --seeds 0 1
